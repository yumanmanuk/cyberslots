# electron-builder — CyberSlots 免安装绿色版（zip 主推）
# 数据目录：默认 %APPDATA%\CyberSlots（见 src/main/config/dataDir.ts）
appId: com.yumanmanuk.cyberslots
productName: CyberSlots
directories:
  output: dist
files:
  - out/**
  - package.json
# 原生模块（@lydell/node-pty 的 conpty.node）必须从 asar 解包，
# 否则无法 dlopen（面板内嵌终端依赖）。
asarUnpack:
  - "**/@lydell/node-pty*/**"
extraResources:
  - from: resources/ai-server
    to: ai-server
  # 品牌图标（scripts/gen-icon.mjs 生成）— 主进程运行时设为窗口/任务栏图标
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # exe 文件图标由 scripts/after-pack.cjs 写入（win.icon 供安装包/快捷方式使用）
  icon: resources/icon.png
  # 不签名也不跑 rcedit，避免联网下载 winCodeSign；图标由 afterPack 钩子写入
  signAndEditExecutable: false
# 免安装分发不签名；杀软误报属已知问题（代码签名列为后期项）
forceCodeSigning: false
npmRebuild: false
# 打包完成后用 resedit 离线写入品牌 exe 图标
afterPack: scripts/after-pack.cjs

